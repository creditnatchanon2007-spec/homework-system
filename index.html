<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ศูนย์รวมการเรียนรู้ (Learning Hub)</title>
  <!-- นำเข้า Tailwind CSS ผ่าน CDN สำหรับจัดรูปแบบหน้าเว็บอย่างรวดเร็วและสวยงาม -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- นำเข้าฟอนต์ Noto Sans Thai จาก Google Fonts เพื่อให้อ่านภาษาไทยได้ง่าย -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- นำเข้า Phosphor Icons สำหรับแสดงไอคอนต่างๆ -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- กำหนดสไตล์พื้นฐาน เช่น ฟอนต์และการเคลื่อนไหวต่างๆ -->
  <style>
    body {
      font-family: 'Noto Sans Thai', sans-serif;
      background-color: #f3f4f6; /* สีพื้นหลังสีเทาอ่อน */
    }
    
    /* Animation สำหรับการโหลดข้อมูล (Pulse effect) */
    .skeleton {
      animation: skeleton-loading 1s linear infinite alternate;
    }
    @keyframes skeleton-loading {
      0% { background-color: hsl(200, 20%, 80%); }
      100% { background-color: hsl(200, 20%, 95%); }
    }

    /* Animation สำหรับการแสดงเนื้อหาให้ค่อยๆ ปรากฏ */
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-gray-800">

  <!-- ส่วนหัว (Header) และแถบนำทาง -->
  <nav class="bg-blue-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="ph ph-notebook text-3xl"></i>
        <h1 class="text-xl font-semibold tracking-wide">ระบบบันทึกการบ้าน</h1>
      </div>
      <div>
        <button onclick="openModal()" class="bg-white text-blue-600 hover:bg-blue-50 px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-sm md:text-base font-medium shadow-sm transition-colors flex items-center space-x-1">
          <i class="ph ph-plus-circle text-lg"></i>
          <span class="hidden md:inline">เพิ่มการบ้าน</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ส่วนเนื้อหาหลักของหน้าเว็บ -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- ส่วนหัวข้อหลักและการค้นหา/กรองข้อมูล -->
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
      <div>
        <h2 class="text-2xl font-bold text-gray-900">รายการการบ้านทั้งหมด</h2>
        <p class="text-gray-500 mt-1">ติดตามกำหนดส่งและงานที่ได้รับมอบหมายทุกวิชา</p>
      </div>

      <!-- แถบเครื่องมือสำหรับค้นหาและกรองเนื้อหา -->
      <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
        <!-- ช่องค้นหาด้วยข้อความ -->
        <div class="relative w-full sm:w-64">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="ph ph-magnifying-glass text-gray-400"></i>
          </div>
          <input type="text" id="searchInput" placeholder="ค้นหารายวิชา, หัวข้อ, ครูผู้สอน..." 
                 class="pl-10 pr-4 py-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
        </div>
      </div>
    </div>

    <!-- ปุ่มสำหรับกรองตามรายวิชาแบบรวดเร็ว -->
    <div class="mb-6 flex flex-wrap gap-2" id="subjectFilters">
      <!-- ปุ่มกรองวิชาจะถูกสร้างด้วย JavaScript -->
      <button class="px-4 py-1.5 rounded-full text-sm font-medium bg-blue-100 text-blue-700 border border-blue-200 transition-colors" data-subject="all">ทั้งหมด</button>
      <!-- ตัวอย่างปุ่มที่จะถูกสร้างเพิ่ม: <button>คณิตศาสตร์</button> -->
    </div>

    <!-- พื้นที่แสดงสถานะกำลังโหลด (Skeleton Loader) -->
    <div id="loader" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- สร้างการ์ดหลอกๆ (Skeleton) 6 ใบ ระหว่างรอข้อมูล -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 h-40">
        <div class="skeleton h-6 w-1/3 mb-4 rounded"></div>
        <div class="skeleton h-5 w-3/4 mb-2 rounded"></div>
        <div class="skeleton h-4 w-1/2 mt-auto rounded"></div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 h-40"><div class="skeleton h-6 w-1/3 mb-4 rounded"></div><div class="skeleton h-5 w-3/4 mb-2 rounded"></div></div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 h-40 hidden md:block"><div class="skeleton h-6 w-1/3 mb-4 rounded"></div><div class="skeleton h-5 w-3/4 mb-2 rounded"></div></div>
    </div>

    <!-- พื้นที่แสดงการ์ดข้อมูลจริงๆ เมื่อโหลดเสร็จแล้ว -->
    <div id="linksContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
      <!-- ข้อมูลจะถูกแทรกที่นี่โดย JavaScript -->
    </div>
    
    <!-- ข้อความแสดงเมื่อไม่พบข้อมูลจากการค้นหา -->
    <div id="noResults" class="hidden text-center py-12">
      <i class="ph ph-magnifying-glass-minus text-5xl text-gray-300 mb-3"></i>
      <h3 class="text-lg font-medium text-gray-700">ไม่พบข้อมูล</h3>
      <p class="text-gray-500 mt-1">ลองเปลี่ยนคำค้นหา หรือตัวกรองของคุณใหม่</p>
    </div>

    <!-- Modal เพิ่มข้อมูลใหม่ (ซ่อนไว้เป็นค่าเริ่มต้น) -->
    <div id="addModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50 px-4 transition-opacity opacity-0 duration-300">
      <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl transform scale-95 transition-transform duration-300" id="modalContent">
        <div class="flex justify-between items-center mb-5">
          <h3 class="text-xl font-bold text-gray-800">เพิ่มการบ้านใหม่</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition-colors">
            <i class="ph ph-x text-2xl"></i>
          </button>
        </div>
        
        <form id="addDataForm" onsubmit="submitForm(event)">
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสวิชา</label>
                <input type="text" id="formCourseCode" required placeholder="เช่น ว30101" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อวิชา</label>
                <input type="text" id="formSubject" required placeholder="เช่น วิทยาศาสตร์" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">หัวข้อที่ส่ง / ชื่องาน</label>
              <input type="text" id="formTopic" required placeholder="เช่น รายงานการทดลอง" 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">ครูประจำวิชา</label>
              <input type="text" id="formTeacher" required placeholder="เช่น ครูสมศรี" 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">กำหนดส่ง</label>
              <input type="date" id="formDueDate" required 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">ลิงก์ส่งงาน / รายละเอียด (ถ้ามี)</label>
              <input type="url" id="formUrl" placeholder="https://..." 
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
            </div>
          </div>
          
          <div class="mt-8 flex justify-end space-x-3">
            <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">ยกเลิก</button>
            <button type="submit" id="submitBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors flex items-center">
              <span id="submitText">บันทึกข้อมูล</span>
              <!-- ไอคอนโหลด (จะแสดงตอนกำลังบันทึก) -->
              <i id="submitSpinner" class="ph ph-spinner-gap animate-spin hidden ml-2 text-lg"></i>
            </button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <!-- ส่วนท้ายหน้า (Footer) -->
  <footer class="text-center text-gray-500 text-sm py-8 mt-auto">
    <p>ระบบบันทึกการบ้าน &copy; <span id="currentYear"></span></p>
  </footer>

  <script>
    // ============================================================================
    // 1. ตั้งค่าระบบ (ใส่ Web App URL จาก Google Apps Script ตรงนี้ที่เดียวจบ)
    // ============================================================================
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzQZ7jtrj0Nq-izo1WU0GS__AqjmyCRWKauBhQDVvhf0FBg4Wd1izz1dlxB6r7JlaxP/exec'; 
    // ============================================================================

    // ตัวแปรสำหรับเก็บข้อมูลทั้งหมด
    let allData = [];
    let currentSubjectFilter = 'all';

    // ============================================================================
    // ฟังก์ชันจัดการหน้าต่าง Modal สำหรับเพิ่มข้อมูล
    // ============================================================================
    const modal = document.getElementById('addModal');
    const modalContent = document.getElementById('modalContent');

    function openModal() {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // ใช้ setTimeout เล็กน้อยเพื่อให้ display:flex ทำงานก่อนเริ่ม animation
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalContent.classList.remove('scale-95');
      }, 10);
    }

    function closeModal() {
      modal.classList.add('opacity-0');
      modalContent.classList.add('scale-95');
      // รอให้ animation จบก่อนซ่อน element
      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.getElementById('addDataForm').reset();
      }, 300);
    }

    // ============================================================================
    // ฟังก์ชันส่งข้อมูลแบบฟอร์มไปยัง Google Apps Script (POST)
    // ============================================================================
    async function submitForm(event) {
      event.preventDefault(); // ป้องกันไม่ให้หน้าเว็บรีเฟรชเมื่อกด Submit
      
      const submitBtn = document.getElementById('submitBtn');
      const submitText = document.getElementById('submitText');
      const submitSpinner = document.getElementById('submitSpinner');
      
      // เปลี่ยนสถานะปุ่มเป็นกำลังโหลด
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
      submitText.textContent = 'กำลังบันทึก...';
      submitSpinner.classList.remove('hidden');

      // รวบรวมข้อมูลจากฟอร์ม
      const newData = {
        courseCode: document.getElementById('formCourseCode').value.trim(),
        subject: document.getElementById('formSubject').value.trim(),
        topic: document.getElementById('formTopic').value.trim(),
        teacher: document.getElementById('formTeacher').value.trim(),
        dueDate: document.getElementById('formDueDate').value,
        url: document.getElementById('formUrl').value.trim()
      };

      try {
        // ส่ง Request แบบ POST ไปที่ Web App
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(newData)
        });

        const result = await response.json();
        
        if (result.status === 'success') {
          closeModal();
          // แสดงสถานะโหลด (Skeleton) และดึงข้อมูลใหม่ทั้งหมด
          document.getElementById('linksContainer').classList.add('hidden');
          document.getElementById('loader').classList.remove('hidden');
          await fetchDataFromAPI();
        } else {
          alert('เกิดข้อผิดพลาดจากเซิร์ฟเวอร์: ' + result.message);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง');
      } finally {
        // คืนค่าปุ่มกลับมาเหมือนเดิม เผื่อเกิด Error หรือบันทึกเสร็จแล้ว
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        submitText.textContent = 'บันทึกข้อมูล';
        submitSpinner.classList.add('hidden');
      }
    }

    // ตั้งค่าปีปัจจุบันใน Footer
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // ฟังก์ชันสำหรับกำหนดสีและไอคอนตามรายวิชา
    function getSubjectStyle(subject) {
      const styles = {
        'คณิตศาสตร์': { color: 'text-indigo-600', bg: 'bg-indigo-50', border: 'border-indigo-100', icon: 'ph-calculator' },
        'วิทยาศาสตร์': { color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-100', icon: 'ph-flask' },
        'ภาษาไทย': { color: 'text-rose-600', bg: 'bg-rose-50', border: 'border-rose-100', icon: 'ph-translate' },
        'ภาษาอังกฤษ': { color: 'text-sky-600', bg: 'bg-sky-50', border: 'border-sky-100', icon: 'ph-chat-circle-text' },
        'สังคมศึกษา': { color: 'text-amber-600', bg: 'bg-amber-50', border: 'border-amber-100', icon: 'ph-globe-hemisphere-west' }
      };
      return styles[subject] || { color: 'text-gray-600', bg: 'bg-gray-50', border: 'border-gray-100', icon: 'ph-book-bookmark' };
    }

    // ฟังก์ชันแปลงรูปแบบวันที่ให้สวยงาม
    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString;
      return date.toLocaleDateString('th-TH', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    // ฟังก์ชันตรวจสอบว่าเลยกำหนดส่งหรือยัง
    function isOverdue(dateString) {
      if (!dateString) return false;
      const dueDate = new Date(dateString);
      dueDate.setHours(23, 59, 59, 999);
      return new Date() > dueDate;
    }

    // ฟังก์ชันสร้างการ์ด HTML (แบบสำหรับแสดงการบ้านโดยเฉพาะ)
    function createCardHTML(item) {
      const style = getSubjectStyle(item.subject);
      const overdue = isOverdue(item.dueDate);
      
      const dateColor = overdue ? 'text-red-600 bg-red-50 border-red-200' : 'text-orange-600 bg-orange-50 border-orange-200';
      const dateIcon = overdue ? 'ph-warning-circle' : 'ph-calendar-blank';

      // ปุ่มลิงก์ หากไม่มีลิงก์จะซ่อน
      const linkButton = item.url 
        ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer" class="mt-4 flex items-center justify-center w-full py-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-sm font-medium transition-colors">
            <span>รายละเอียด / ส่งงาน</span>
            <i class="ph ph-arrow-square-out ml-1"></i>
           </a>`
        : '';

      return `
        <div class="group block bg-white rounded-xl p-5 shadow-sm border border-gray-200 hover:shadow-md hover:border-blue-300 transition-all duration-200 relative overflow-hidden fade-in">
          <div class="absolute top-0 left-0 w-full h-1 ${style.bg.replace('50', '400')} opacity-70 group-hover:opacity-100 transition-opacity"></div>
          
          <div class="flex justify-between items-start mb-3 mt-1">
            <div class="flex items-center space-x-2">
              <div class="p-2 rounded-lg ${style.bg} ${style.color} ${style.border} border">
                <i class="ph ${style.icon} text-lg"></i>
              </div>
              <div>
                <div class="text-xs text-gray-500 font-mono">${item.courseCode}</div>
                <span class="text-sm font-semibold ${style.color}">${item.subject}</span>
              </div>
            </div>
          </div>
          
          <h3 class="text-lg font-bold text-gray-800 mb-2 line-clamp-2" title="${item.topic}">
            ${item.topic}
          </h3>
          
          <div class="flex items-center text-sm text-gray-600 mb-3">
            <i class="ph ph-user mr-1.5 text-gray-400"></i>
            <span>${item.teacher}</span>
          </div>

          <div class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium border ${dateColor}">
            <i class="ph ${dateIcon} mr-1.5 text-sm"></i>
            กำหนดส่ง: ${formatDate(item.dueDate)}
          </div>
          
          ${linkButton}
        </div>
      `;
    }

    // ฟังก์ชันแสดงข้อมูล
    function renderData(dataToRender) {
      const container = document.getElementById('linksContainer');
      const noResults = document.getElementById('noResults');
      container.innerHTML = '';
      
      if (dataToRender.length === 0) {
        container.classList.add('hidden');
        noResults.classList.remove('hidden');
      } else {
        container.classList.remove('hidden');
        noResults.classList.add('hidden');
        container.innerHTML = dataToRender.map(item => createCardHTML(item)).join('');
      }
    }

    // ฟังก์ชันสร้างปุ่มตัวกรองวิชา
    function buildSubjectFilters(data) {
      const subjects = [...new Set(data.map(item => item.subject))];
      const filterContainer = document.getElementById('subjectFilters');
      
      subjects.forEach(subject => {
        const btn = document.createElement('button');
        btn.textContent = subject;
        btn.dataset.subject = subject;
        btn.className = "px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-300 hover:bg-gray-50 transition-colors";
        
        btn.addEventListener('click', () => {
          document.querySelectorAll('#subjectFilters button').forEach(b => {
             b.className = "px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-300 hover:bg-gray-50 transition-colors";
          });
          btn.className = "px-4 py-1.5 rounded-full text-sm font-medium bg-blue-100 text-blue-700 border border-blue-200 transition-colors";
          currentSubjectFilter = subject;
          applyFilters();
        });
        filterContainer.appendChild(btn);
      });

      const allBtn = document.querySelector('#subjectFilters button[data-subject="all"]');
      allBtn.addEventListener('click', () => {
         document.querySelectorAll('#subjectFilters button').forEach(b => {
             b.className = "px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-300 hover:bg-gray-50 transition-colors";
          });
          allBtn.className = "px-4 py-1.5 rounded-full text-sm font-medium bg-blue-100 text-blue-700 border border-blue-200 transition-colors";
          currentSubjectFilter = 'all';
          applyFilters();
      });
    }

    // ฟังก์ชันกรองข้อมูล
    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      const filteredData = allData.filter(item => {
        // กรองได้ทั้ง ชื่องาน, ชื่อวิชา, รหัสวิชา, และชื่อครู
        const matchSearch = 
          item.topic.toLowerCase().includes(searchTerm) || 
          item.subject.toLowerCase().includes(searchTerm) ||
          item.courseCode.toLowerCase().includes(searchTerm) ||
          item.teacher.toLowerCase().includes(searchTerm);
          
        const matchSubject = currentSubjectFilter === 'all' || item.subject === currentSubjectFilter;
        return matchSearch && matchSubject;
      });
      renderData(filteredData);
    }

    // ดึงข้อมูลผ่าน API
    async function fetchDataFromAPI() {
      const loader = document.getElementById('loader');
      try {
        if(!WEB_APP_URL || WEB_APP_URL.includes('ใส่_URL')) {
          throw new Error("กรุณาใส่ Web App URL ที่จุดตั้งค่าด้านบนของไฟล์ให้ถูกต้อง");
        }

        const response = await fetch(WEB_APP_URL);
        if (!response.ok) throw new Error(`เกิดข้อผิดพลาดในการเชื่อมต่อ (สถานะ: ${response.status})`);
        
        const data = await response.json();
        allData = data;
        
        loader.classList.add('hidden');
        buildSubjectFilters(data);
        renderData(data);
        
      } catch (error) {
        console.error("Error fetching data:", error);
        loader.innerHTML = `
          <div class="col-span-full text-center py-10">
            <i class="ph ph-warning-circle text-4xl text-red-500 mb-2"></i>
            <p class="text-red-600 font-medium">ไม่สามารถโหลดข้อมูลได้</p>
            <p class="text-gray-500 text-sm mt-1">โปรดตรวจสอบ Web App URL ว่าถูกต้องหรือไม่ หรือรอสักครู่แล้วโหลดใหม่<br><br><span class="text-xs font-mono text-gray-400">${error.message}</span></p>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('searchInput').addEventListener('input', applyFilters);
      // ตัวกรอง dropdown ถูกลบออกไปแล้วตาม UI ใหม่
      fetchDataFromAPI();
    });
  </script>
</body>
</html>
